vars:
  output_dir: sglang-logs-final/8-gpu
  target_model_4b: "" # your Qwen3-4B or compatible target model path.
  target_model_8b: "" # your Qwen3-8B or compatible target model path.

jobs:
  - name: gpu0
    gpu: 0
    target_model: ${target_model_8b}
    draft_model: "" # your 8B draft model path.
    output_md: ${output_dir}/gpu0.md
    dataset_name: &eval_datasets ["gsm8k:128", "aime24:30", "aime25:30", "math500:128", "mbpp:128", "humaneval:128", "mt-bench:80", "mgsm_zh:32", "swe-bench:128", "alpaca:128"]
    concurrency_num: "2"
    enable_think: true
    attention_backends: fa3
    max_new_tokens: 8192

  - name: gpu1
    gpu: 1
    target_model: ${target_model_4b}
    draft_model: "" # your 4B draft model path.
    output_md: ${output_dir}/gpu1.md
    dataset_name: *eval_datasets
    concurrency_num: "2"
    enable_think: true
    attention_backends: fa3
    max_new_tokens: 8192
